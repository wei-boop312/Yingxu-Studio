x-owner: &owner
  visual.owner: ${VISUAL_OWNER:?private owner id required}
  visual.workspace: ${VISUAL_WORKSPACE:?workspace id required}
x-postgres: &postgres
  cpus: 1.0
  mem_limit: 512m
  pids_limit: 128
  stop_grace_period: 30s
  image: postgres:17.11-bookworm@sha256:665dc7b37ac52a17e298511414c21d23ffa4e6a6ef6225b3e5d59c7afb35e994
  environment:
    POSTGRES_DB: postgres
    POSTGRES_USER: ${PG_BOOTSTRAP_USER:?private bootstrap user required}
    POSTGRES_PASSWORD: ${PG_BOOTSTRAP_PASSWORD:?private bootstrap password required}
  labels: *owner
  healthcheck:
    test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d postgres"]
    interval: 2s
    timeout: 2s
    retries: 40
services:
  postgres-test:
    <<: *postgres
    ports: ["127.0.0.1:${PG_TEST_PORT:-55432}:5432"]
    volumes: [pg-test:/var/lib/postgresql/data]
  postgres-dev:
    <<: *postgres
    ports: ["127.0.0.1:${PG_DEV_PORT:-55433}:5432"]
    volumes: [pg-dev:/var/lib/postgresql/data]
  rabbitmq:
    cpus: 1.0
    mem_limit: 768m
    pids_limit: 128
    stop_grace_period: 40s
    image: rabbitmq:4.4.0-alpine@sha256:7b77c3d3a996c7fcca1ca8bf53ce1557ff43c13b8ca2c132df6031781b209ef2
    hostname: visual-rabbitmq
    labels: *owner
    environment:
      RABBITMQ_DEFAULT_USER: ${MQ_BOOTSTRAP_USER:?private MQ user required}
      RABBITMQ_DEFAULT_PASS: ${MQ_BOOTSTRAP_PASSWORD:?private MQ password required}
      RABBITMQ_DEFAULT_VHOST: visual-test
    ports: ["127.0.0.1:${MQ_PORT:-5679}:5672"]
    volumes: [rabbit-data:/var/lib/rabbitmq]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 3s
      timeout: 5s
      retries: 40
  s3:
    cpus: 1.0
    mem_limit: 1024m
    pids_limit: 128
    stop_grace_period: 40s
    # The pinned image has curl but no HEALTHCHECK. This is HTTP liveness;
    # ComposeRuntime additionally verifies authenticated bucket access.
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent --show-error --max-time 1 http://127.0.0.1:9333/cluster/status > /dev/null && curl --silent --show-error --max-time 1 --output /dev/null http://127.0.0.1:8333/"]
      interval: 2s
      timeout: 2s
      retries: 40
      start_period: 5s
    image: chrislusf/seaweedfs:4.53@sha256:ccad23e18639c8b98cee17e7100b95830a06077b56d8e5b006d6dcf8ec5e94a0
    labels: *owner
    working_dir: /data
    command: ["server", "-filer", "-s3", "-dir=/data", "-master.dir=/data", "-ip=127.0.0.1", "-ip.bind=0.0.0.0", "-s3.config=/etc/visual/s3.json", "-s3.port.lance=0", "-s3.port.iceberg=0", "-volume.max=16", "-master.volumeSizeLimitMB=64"]
    ports: ["127.0.0.1:${S3_PORT:-18333}:8333"]
    volumes:
      - s3-data:/data
      - type: bind
        source: ${S3_CONFIG_FILE:?private S3 identity file required}
        target: /etc/visual/s3.json
        read_only: true
volumes:
  pg-test: {labels: *owner}
  pg-dev: {labels: *owner}
  rabbit-data: {labels: *owner}
  s3-data: {labels: *owner}
networks:
  default: {labels: *owner}
