title = "Cross Studio full-history secret scan"
minVersion = "v8.30.1"

[extend]
useDefault = true

[[allowlists]]
description = "Official Python image public signing fingerprint in archived Docker inspection; not a credential"
targetRules = ["generic-api-key"]
condition = "AND"
regexTarget = "match"
paths = ['''^docs/evidence/ci-[0-9]+/docker-images\.jsonl$''']
regexes = ['''^GPG_KEY=7169605F62C751356D054A26A821E680E5FA6305"$''']
