[project]
name = "visual-production-platform"
version = "0.1.0"
requires-python = ">=3.13,<3.15"
dependencies = [
    "Pillow>=13,<14",
    "aio-pika>=10.2.3",
    "alembic>=1.20.1",
    "argon2-cffi>=25.1.0",
    "asyncpg>=0.32.0",
    "boto3>=1.44.1",
    "fastapi>=0.162,<0.163",
    "google-genai==3.3.0",
    "httpx>=0.28.1,<0.29",
    "psycopg[binary]>=3.3.9",
    "pydantic>=2.14,<2.15",
    "pyjwt[crypto]>=2.15.1",
    "uvicorn>=0.41,<1",
]
[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "jsonschema==4.26.0",
    "mypy==2.4.1",
    "pip-audit==2.10.1",
    "pyyaml==6.0.3",
    "ruff==0.17.5",
]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.per-file-ignores]
# Standalone entry points add this isolated source checkout before importing it.
"scripts/*.py" = ["E402"]
"migrations/env.py" = ["E402"]

[tool.mypy]
python_version = "3.13"
files = ["src/visual_platform", "scripts"]
mypy_path = ["src", "scripts"]
namespace_packages = true
explicit_package_bases = true
check_untyped_defs = true
no_implicit_optional = true
warn_unused_ignores = true
warn_redundant_casts = true
show_error_codes = true

[[tool.mypy.overrides]]
# These installed dependencies do not ship type information; first-party
# modules remain checked. Their protocol behavior has native/contract tests.
module = ["asyncpg", "asyncpg.*", "boto3", "boto3.*", "botocore", "botocore.*", "yaml"]
ignore_missing_imports = true
